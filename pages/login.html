<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/pages/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <title>Đăng Nhập</title>
  </head>

  <body>
    <header class="header header-login">
      <div class="logo-header">
        <i class="fa-solid fa-clapperboard"></i>
        <a href="../index.html" class="logo-header-text"
          >Rikkei <span>Cinema</span></a
        >
      </div>

      <nav class="navbar-header">
        <a href="../index.html" class="navbar-item">Trang Chủ</a>
        <a href="../index.html#about" class="navbar-item">Thông Tin</a>
        <a href="../index.html#newsletter" class="navbar-item">Liên Hệ</a>
        <button class="nav-btn-login" onclick="location.href = './login.html'">
          Đăng Nhập
        </button>
      </nav>
    </header>
    <main class="login-wrapper">
      <form class="login-card" id="login-form" novalidate>
        <div class="login-image">
          <img src="../assets/images/login/login.png" alt="Popcorn" />
        </div>

        <div class="login-body">
          <h2 class="login-title">Chào mừng quay trở lại</h2>

          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <input
                name="email"
                type="text"
                id="loginEmail"
                placeholder="Nhập email của bạn"
              />
              <i class="fa-regular fa-envelope"></i>
              <small class="error-message"></small>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="input-wrapper">
              <input
                name="password"
                type="password"
                id="loginPassword"
                placeholder="Nhập mật khẩu của bạn"
              />
              <i class="fa-regular fa-eye"></i>
              <small class="error-message"></small>
            </div>
          </div>

          <div class="form-options">
            <label class="remember">
              <input type="checkbox" id="rememberMe" />
              <span>Ghi nhớ đăng nhập</span>
            </label>

            <a href="#" class="forgot-password">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="login-btn" id="login-btn">
            Đăng nhập <i class="fa-solid fa-arrow-right-to-bracket"></i>
          </button>

          <p class="register-text">
            Bạn chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a>
          </p>
        </div>
      </form>
    </main>
    <div id="toast-container"></div>
    <script type="module" src="../scripts/pages/loginPage.js"></script>
  </body>
</html>
